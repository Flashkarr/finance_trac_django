{% extends 'base.html' %}

{% block title %}Вхід{% endblock title %}

{% block main %}
<div class="card">
    <h2>Вхід</h2>

    {% if errors.login %}
        <p class="error">{{ errors.login }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Логін" required>
        <input type="password" name="password" placeholder="Пароль" required>

        <button type="submit">Увійти</button>
    </form>
</div>
{% endblock main %}
