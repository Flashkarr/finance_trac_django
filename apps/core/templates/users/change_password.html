{% extends 'base.html' %}

{% block title %}Зміна пароля{% endblock title %}

{% block main %}
<div class="card center-card">
    <h2>Змінити пароль</h2>

    {% if errors.same_password %}
        <p class="error">{{ errors.same_password }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Змінити пароль</button>
    </form>
</div>
{% endblock main %}
