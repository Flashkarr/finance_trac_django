{% extends 'base.html' %}

{% block title %}Редагування транзакції{% endblock %}

{% block main %}
<div class="card center-card">
    <h2>Редагувати транзакцію</h2>

    <form method="post">
        {% csrf_token %}

        <input type="text" name="title" value="{{ transaction.title }}" required>
        <input type="number" step="0.01" name="amount" value="{{ transaction.amount }}" required>

        <select name="transaction_type">
            {% for value, label in transaction_types %}
                <option value="{{ value }}" {% if transaction.transaction_type == value %}selected{% endif %}>
                    {{ label }}
                </option>
            {% endfor %}
        </select>

        <select name="wallet">
            {% for w in wallets %}
                <option value="{{ w.id }}" {% if transaction.wallet.id == w.id %}selected{% endif %}>
                    {{ w.name }}
                </option>
            {% endfor %}
        </select>

        <select name="category">
            {% for c in categories %}
                <option value="{{ c.id }}" {% if transaction.category.id == c.id %}selected{% endif %}>
                    {{ c.name }}
                </option>
            {% endfor %}
        </select>

        <select name="payment_method">
            {% for p in payment_methods %}
                <option value="{{ p.id }}" {% if transaction.payment_method.id == p.id %}selected{% endif %}>
                    {{ p.name }}
                </option>
            {% endfor %}
        </select>

        <input type="date" name="transaction_date" value="{{ transaction.transaction_date|date:'Y-m-d' }}">
        <input type="text" name="note" value="{{ transaction.note }}">

        <button type="submit">Зберегти</button>
    </form>
</div>
{% endblock %}
